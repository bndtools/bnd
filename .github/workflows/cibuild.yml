name: 'CI Build'

on:
  push:
    branches-ignore:
    - 'dependabot/**'
    paths:
    - '**'
    - '!docs/**'
    - '!.github/**'
    - '.github/**/*ci*'
    - '!CONTRIBUTING.md'
    - '!DEV_README.md'
    - '!README.md'
  pull_request:
    paths:
    - '**'
    - '!docs/**'
    - '!.github/**'
    - '.github/**/*ci*'
    - '!CONTRIBUTING.md'
    - '!DEV_README.md'
    - '!README.md'

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=true
  MAVEN_OPTS: >-
    -Dhttp.keepAlive=false
    -Dmaven.wagon.http.pool=false
    -Dmaven.wagon.http.retryHandler.count=3
    -Daether.connector.http.retryHandler.count=5
    -Daether.connector.http.reuseConnections=false
    -Daether.connector.http.connectionMaxTtl=25
    -Daether.connector.connectTimeout=120000
  BNDTOOLS_CORE_TEST_NOJUNITOSGI: true # This test is very flaky on CI

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build-canonical:
    if: ${{ github.repository == 'bndtools/bnd' }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        java: [ '17' ]
        runner: [ '{0}' ]
        include:
          - os: 'ubuntu-latest'
            java: '17'
            runner: '{0}'
            canonical: true
            reference: true
            fetch-depth: '0'
    name: Build Canonical JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ matrix.fetch-depth }}
      - name: Set up Java 8 + ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: |
            8
            ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build
        id: build
        run: |
          ${{ format(matrix.runner, './.github/scripts/ci-build.sh') }}
      - name: Configure settings.xml for Publish
        if: ${{ (github.event_name != 'pull_request') && ((github.ref == 'refs/heads/master') || (github.ref == 'refs/heads/next')) }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          server-id: bndtools.jfrog.io
          server-username: JFROG_USERNAME
          server-password: JFROG_PASSWORD
      - name: Publish
        if: ${{ (github.event_name != 'pull_request') && ((github.ref == 'refs/heads/master') || (github.ref == 'refs/heads/next')) }}
        id: publish
        run: |
          env | sort
          ./.github/scripts/ci-publish.sh
        env:
          CANONICAL: true
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          P2_SIGN: true
          P2_SIGN_KEY: ${{ secrets.GPG_KEY_ID }}
          P2_SIGN_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          P2_PUB_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          SONATYPE_BEARER: ${{ secrets.SONATYPE_BEARER }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

      - name: Upload P2 Repo artifact
        if: ${{ matrix.canonical && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-${{ github.event.pull_request.number }}-jdk${{ matrix.java }}-${{ matrix.os }}
          path: org.bndtools.p2/generated/org.bndtools.p2.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publish P2 repo
        if: ${{ matrix.canonical && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          JFROG_SNAPSHOT_TOKEN: ${{ secrets.JFROG_SNAPSHOT_TOKEN }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          artifact_path="org.bndtools.p2/generated/org.bndtools.p2.jar"
          repository_name="${PR}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            repository_name="${GITHUB_REF_NAME}"
          fi
          if [[ -z "${JFROG_SNAPSHOT_TOKEN}" || -z "${JFROG_USERNAME}" || -z "${JFROG_PASSWORD}" ]]; then
            echo "Missing JFROG_SNAPSHOT_TOKEN, JFROG_USERNAME, or JFROG_PASSWORD" >&2
            exit 1
          fi
          delete_auth_args=(-H "Authorization: Bearer ${JFROG_SNAPSHOT_TOKEN}")
          upload_auth_args=(--user "${JFROG_USERNAME}:${JFROG_PASSWORD}")
          jfrog_url="https://bndtools.jfrog.io/artifactory/p2/pr/${repository_name}"

          if [[ ! -f "${artifact_path}" ]]; then
            echo "Artifact ${artifact_path} not found, skipping upload."
            exit 0
          fi

          if curl --silent --show-error --head --fail "${delete_auth_args[@]}" "${jfrog_url}" >/dev/null; then
            echo "URL already exists; deleting previous deployment"
            curl --silent --show-error --fail --request DELETE \
              "${delete_auth_args[@]}" \
              "${jfrog_url}"
          fi

          echo "Uploading p2 repo to ${jfrog_url}"
          curl --silent --show-error --fail \
            "${upload_auth_args[@]}" \
            -H "X-Explode-Archive: true" \
            --upload-file "${artifact_path}" \
            "${jfrog_url}/org.bndtools.p2.zip"
          echo "Upload successful"
      - name: Upload Test Reports
        if: ${{ always() && ((steps.build.outcome == 'success') || (steps.build.outcome == 'failure')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Build_JDK${{ matrix.java }}_${{ matrix.os }}-test-reports
          path: |
            */generated/test-reports/*/TEST-*.xml
            maven/*/target/surefire-reports/TEST-*.xml
            gradle-plugins/*/build/test-results/*/TEST-*.xml
            gradle-plugins/build/reports/*

  build-others:
    needs: [build-canonical]
    if: ${{ always() && (needs.build-canonical.result != 'failure') && (needs.build-canonical.result != 'cancelled') }}
    strategy:
      fail-fast: ${{ (github.repository != 'bndtools/bnd') || ((github.ref != 'refs/heads/master') && (github.ref != 'refs/heads/next')) || (github.event_name == 'pull_request') }}
      matrix:
        os: [ 'ubuntu-latest', 'windows-latest' ]
        java: [ '21', '25' ]
        runner: [ '{0}' ]
        exclude:
          - os: 'ubuntu-latest'
            java: '17'
        include:
          - os: 'windows-latest'
            java: '17'
            runner: '{0}'
    name: Build Others JDK${{ matrix.java }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Java 8 + ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: |
            8
            ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build
        id: build
        run: |
          ${{ format(matrix.runner, './.github/scripts/ci-build.sh') }}
      - name: Upload Test Reports
        if: ${{ always() && ((steps.build.outcome == 'success') || (steps.build.outcome == 'failure')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Build_JDK${{ matrix.java }}_${{ matrix.os }}-test-reports
          path: |
            */generated/test-reports/*/TEST-*.xml
            maven/*/target/surefire-reports/TEST-*.xml
            gradle-plugins/*/build/test-results/*/TEST-*.xml
            gradle-plugins/build/reports/*
